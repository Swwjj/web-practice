<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品类型管理</title>
    <style>
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f6fa; margin: 0; }
        .container { max-width: 1200px; margin: 30px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 12px #0001; padding: 30px; }
        h1 { color: #4e54c8; }
        .content-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: #fafbff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px #0001; }
        .panel h2 { font-size: 18px; color: #333; border-left: 4px solid #4e54c8; padding-left: 10px; margin-bottom: 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 5px rgba(102, 126, 234, 0.3); }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.3s; margin-right: 10px; margin-bottom: 10px; }
        .btn-primary { background: linear-gradient(90deg, #4e54c8, #8f94fb); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(102, 126, 234, 0.4); }
        .btn-danger { background: #ff6b6b; color: #fff; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(255, 107, 107, 0.4); }
        .btn-success { background: #51cf66; color: #fff; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(81, 207, 102, 0.4); }
        .btn-warning { background: #ffd43b; color: #333; }
        .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(255, 212, 59, 0.4); }
        .tree-container { max-height: 400px; overflow-y: auto; border: 1px solid #ddd; border-radius: 5px; padding: 10px; background: #fafafa; }
        .tree-item { padding: 8px; margin: 2px 0; border-radius: 3px; cursor: pointer; transition: background-color 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .tree-item:hover { background-color: #e3f2fd; }
        .tree-item.selected { background-color: #bbdefb; border-left: 3px solid #667eea; }
        .tree-item .name { flex: 1; }
        .tree-item .actions { display: flex; gap: 5px; }
        .tree-item .actions button { padding: 4px 8px; font-size: 12px; border: none; border-radius: 3px; cursor: pointer; }
        .tree-item .actions .edit-btn { background: #ffd43b; color: #333; }
        .tree-item .actions .delete-btn { background: #ff6b6b; color: white; }
        .children { margin-left: 20px; border-left: 2px solid #ddd; padding-left: 10px; }
        .message { padding: 10px; border-radius: 5px; margin-bottom: 15px; font-weight: bold; }
        .message.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .message.info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .loading { text-align: center; padding: 20px; color: #666; }
        .empty-state { text-align: center; padding: 40px; color: #666; }
        .empty-state i { font-size: 48px; margin-bottom: 10px; opacity: 0.5; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); }
        .modal-content { background-color: white; margin: 10% auto; padding: 20px; border-radius: 10px; width: 80%; max-width: 500px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #ddd; }
        .modal-header h3 { margin: 0; color: #333; }
        .close { color: #aaa; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: #000; }
        @media (max-width: 768px) { .content-wrapper { grid-template-columns: 1fr; } }
        .sidebar {
            width: 250px;
            background: white;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px 0;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
        }
        .nav-item {
            padding: 15px 25px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border-left: 3px solid transparent;
            color: #333;
            font-size: 16px;
            display: flex;
            align-items: center;
        }
        .nav-item:hover {
            background-color: #f8f9fa;
            border-left-color: #667eea;
        }
        .nav-item.active {
            background-color: #e3f2fd;
            border-left-color: #667eea;
            color: #667eea;
        }
        .nav-item i {
            margin-right: 10px;
            width: 20px;
        }
        .main-content {
            margin-left: 250px;
            padding: 30px;
        }
        @media (max-width: 900px) {
            .main-content { padding: 10px; }
        }
        @media (max-width: 700px) {
            .sidebar { position: static; width: 100%; height: auto; box-shadow: none; }
            .main-content { margin-left: 0; padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="nav-item" id="nav-dashboard" onclick="location.href='admin-dashboard.html'"><i>📊</i>仪表盘</div>
        <div class="nav-item" id="nav-user" onclick="location.href='admin-dashboard.html#user-content'"><i>👥</i>用户管理</div>
        <div class="nav-item" id="nav-order" onclick="location.href='admin-dashboard.html#order-content'"><i>📦</i>订单管理</div>
        <div class="nav-item" id="nav-product" onclick="location.href='product-management.html'"><i>🛒</i>商品管理</div>
        <div class="nav-item" id="nav-type" onclick="location.href='product-type-management.html'"><i>📦</i>产品类型管理</div>
    </div>
    <div class="main-content">
        <div class="container">
            <div class="header">
                <h1>产品类型管理</h1>
                <p>管理系统中的产品类型分类，支持层级结构管理</p>
            </div>
            <div class="content-wrapper">
                <!-- 左侧：产品类型树形结构 -->
                <div class="panel">
                    <h2>产品类型结构</h2>
                    <div class="form-group">
                        <button class="btn btn-primary" onclick="loadProductTypes()">刷新数据</button>
                        <button class="btn btn-success" onclick="showAddModal()">新增类型</button>
                    </div>
                    <div id="message-container"></div>
                    <div id="tree-container" class="tree-container">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
                <!-- 右侧：操作面板 -->
                <div class="panel">
                    <h2>操作面板</h2>
                    <div class="form-group">
                        <label>选择父类型：</label>
                        <select id="parentTypeSelect">
                            <option value="0">顶级分类</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>类型名称：</label>
                        <input type="text" id="typeName" placeholder="请输入类型名称">
                    </div>
                    <div class="form-group">
                        <label>排序序号：</label>
                        <input type="number" id="sortOrder" placeholder="请输入排序序号" value="1">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" onclick="addProductType()">新增类型</button>
                        <button class="btn btn-warning" onclick="updateProductType()">更新类型</button>
                        <button class="btn btn-danger" onclick="deleteProductType()">删除类型</button>
                    </div>
                    <div class="form-group">
                        <h3>快速操作</h3>
                        <button class="btn btn-primary" onclick="loadPathParams()">获取带路径参数</button>
                        <button class="btn btn-primary" onclick="loadPType()">获取产品类型</button>
                        <button class="btn btn-primary" onclick="loadPartsType()">获取配件类型</button>
                    </div>
                    <div id="operation-result"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- 编辑模态框 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑产品类型</h3>
                <span class="close" onclick="closeEditModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>类型名称：</label>
                <input type="text" id="editTypeName" placeholder="请输入类型名称">
            </div>
            <div class="form-group">
                <button class="btn btn-primary" onclick="saveEdit()">保存</button>
                <button class="btn btn-danger" onclick="closeEditModal()">取消</button>
            </div>
        </div>
    </div>
    <script>
        // 高亮当前页面
        const path = window.location.pathname;
        const hash = window.location.hash;
        if (path.includes('admin-dashboard.html') && (!hash || hash === '#dashboard-content')) {
            document.getElementById('nav-dashboard').classList.add('active');
        } else if (path.includes('admin-dashboard.html') && hash === '#user-content') {
            document.getElementById('nav-user').classList.add('active');
        } else if (path.includes('admin-dashboard.html') && hash === '#order-content') {
            document.getElementById('nav-order').classList.add('active');
        } else if (path.includes('product-management.html')) {
            document.getElementById('nav-product').classList.add('active');
        } else if (path.includes('product-type-management.html')) {
            document.getElementById('nav-type').classList.add('active');
        }
    </script>
    <script src="product-type-management.js"></script>
</body>
</html>
